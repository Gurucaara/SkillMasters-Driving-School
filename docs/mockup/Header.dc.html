<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:100%;font-family:Inter,system-ui,sans-serif;color:var(--text,#141414);position:sticky;top:0;z-index:10">
<div style="background:var(--accent,#E6A817);color:#0B0B0B;font-size:14px;font-weight:600">
<div style="max-width:1200px;margin:0 auto;padding:9px 24px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;align-items:center">
<span>MTO-approved BDE · Licence #L4H7 · Bundle &amp; save up to $80</span>
<span style="display:flex;gap:16px;align-items:center"><a href="tel:+12049795184" style="color:#0B0B0B;text-decoration:none">204-979-5184</a><span>London, ON &amp; area</span>
<a href="https://www.facebook.com/profile.php?id=61560786427720" aria-label="Facebook" style="color:#0B0B0B;display:flex"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H8v4h2v8h4v-8h3l1-4h-4V8z"/></svg></a>
<a href="https://www.instagram.com/skillmastersdrivingschool/" aria-label="Instagram" style="color:#0B0B0B;display:flex"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a></span>
</div>
</div>
<header style="background:var(--header,#FFFFFFE8);border-bottom:1px solid var(--line,#EADFCB);backdrop-filter:blur(12px)">
<div style="max-width:1200px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text,#141414)">
<img src="/_blob/7a73d9ea0051e6766381e6da7801cf5e" alt="Skillmasters lion logo" style="width:50px;height:50px;object-fit:contain;background:#FBF7EE;border-radius:12px;padding:4px;box-sizing:border-box">
<span><span style="display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:17px;letter-spacing:.04em">SKILLMASTERS</span><span style="display:block;font-size:11px;color:var(--muted,#5A5348);letter-spacing:.1em">DRIVING SCHOOL LTD.</span></span>
</a>
<nav aria-label="Main" style="display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="8">
<a href="{{i.href}}" class="navlink" style="color:{{i.color}};font-weight:{{i.weight}};text-decoration:none;padding:8px 0;border-bottom:{{i.line}}">{{i.label}}</a>
</sc-for>
</nav>
<div style="display:flex;align-items:center;gap:8px">
<button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:44px;height:44px;border-radius:999px;border:1px solid var(--line,#EADFCB);background:var(--surface,#FFFFFF);color:var(--text,#141414);display:flex;align-items:center;justify-content:center;cursor:pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></sc-if>
</button>
<a href="Checkout.dc.html" style="background:var(--accent,#E6A817);color:#0B0B0B;padding:12px 20px;border-radius:999px;font-weight:700;text-decoration:none;font-size:15px">Book now</a>
</div>
</div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","about","bde","lessons","pricing","reviews","blog","contact"],"default":"home"},"isDark":{"editor":"boolean","default":false},"onToggle":{"editor":null},"$preview":{"width":1280,"height":118}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'home';
const isDark = !!this.props.isDark;
const nav = [['home', 'Home', 'Main.dc.html'], ['about', 'About', 'About.dc.html'], ['bde', 'BDE Program', 'BDE.dc.html'], ['lessons', 'G &amp; G2 Lessons', 'Lessons.dc.html'], ['pricing', 'Pricing', 'Pricing.dc.html'], ['reviews', 'Reviews', 'Reviews.dc.html'], ['blog', 'Blog', 'Blog.dc.html'], ['contact', 'Contact', 'Contact.dc.html']];
const items = nav.map(([k, label, href]) => ({ label: label.replace('&amp;', '&'), href, color: k === a ? 'var(--accent-text,#8A5F00)' : 'var(--text,#141414)', weight: k === a ? '700' : '500', line: k === a ? '2px solid var(--accent,#E6A817)' : '2px solid transparent' }));
return { items, isDark, isLight: !isDark, toggleLabel: isDark ? 'Switch to light theme' : 'Switch to dark theme', toggle: this.props.onToggle || (() => {}) };
}
}
</script>
</body>
</html>
