<!doctype html>
<!--
  Offline page, shown by the service worker (public/sw.js, which caches it as /offline) when there's no connection and the
  page wasn't visited before. Fully self-contained (inline styles, one icon) so it works with
  nothing else cached. Contact details are repeated from src/data/site.ts: keep them in sync.
-->
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline | Skillmasters Driving School</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0b0b; color: #f5efe3;
      }
      main { max-width: 440px; text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 1.75rem; margin: 20px 0 8px; }
      p { color: #c9bfae; line-height: 1.6; margin: 0 0 24px; }
      .actions { display: flex; flex-direction: column; gap: 12px; }
      a, button {
        display: block; min-height: 48px; padding: 14px 20px; border-radius: 999px;
        font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
      }
      .primary { background: #e6b33c; color: #0b0b0b; border: 0; }
      .secondary { background: transparent; color: #f5efe3; border: 2px solid #3a3426; }
      a:focus-visible, button:focus-visible { outline: 3px solid #e6b33c; outline-offset: 3px; }
      small { display: block; margin-top: 24px; color: #8f8676; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Skillmasters lion logo" />
      <h1>You're offline</h1>
      <p>We can't load this page right now. You can still reach us directly. Calls and texts work without data.</p>
      <div class="actions">
        <a class="primary" href="tel:+12049795184">Call or text 204-979-5184</a>
        <a class="secondary" href="https://wa.me/12049795184">WhatsApp us</a>
        <a class="secondary" href="mailto:info@skillmastersdrivingschool.ca">Email info@skillmastersdrivingschool.ca</a>
        <button class="secondary" type="button" onclick="location.reload()">Try again</button>
      </div>
      <small>Skillmasters Driving School Ltd. · 9 am – 6 pm, 7 days</small>
    </main>
  </body>
</html>
